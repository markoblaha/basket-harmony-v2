<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#dfe6df" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Basket Harmony" />
    <meta name="description" content="Spoločný nákupný zoznam domácnosti" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Basket Harmony</title>
    <!--
      Farebný režim a jazyk sa nastavia ešte pred prvým vykreslením, aby pri tmavom
      režime nebliklo svetlé pozadie. Rovnakú logiku má aj src/theme/ThemeProvider.tsx
      (voľba "bh.theme": light | dark | system) a src/i18n/core.ts (voľba "bh.locale").
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var theme = null;
        var locale = null;
        try {
          theme = localStorage.getItem("bh.theme");
          locale = localStorage.getItem("bh.locale");
        } catch (e) {}
        var dark = theme === "dark" || (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        root.dataset.theme = dark ? "dark" : "light";
        root.style.colorScheme = dark ? "dark" : "light";
        root.lang = locale === "en" ? "en" : "sk";
        var bar = document.querySelector('meta[name="theme-color"]');
        if (bar) bar.setAttribute("content", dark ? "#0f1c1d" : "#dfe6df");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
