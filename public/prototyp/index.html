<!doctype html>
<html lang="sk">
<head>

<meta name="mobile-web-app-capable" content="yes">

<style>
html, body { margin: 0; height: 100%; background: #111; }
/* v telefóne: hlavička a spodná lišta ustúpia výrezu displeja a pásiku na spodku */
.app:not(.framed) { --sat: max(10px, env(safe-area-inset-top, 0px)); --sab: max(12px, env(safe-area-inset-bottom, 0px)); }
.intro { padding-top: max(24px, env(safe-area-inset-top, 0px)) !important; }
</style>
</head>
<body>
<title>Basket Harmony prototyp</title>
<meta name="description" content="Interaktívny prototyp aplikácie Basket Harmony v dvoch témach">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&family=Fraunces:opsz,wght@9..144,400..700&family=Inter:opsz,wght@14..32,400..800&display=swap">
<style>
/* Stránka okolo telefónu (počítač) – na mobile appka vyplní celú obrazovku. */
:root {
  --page: #ece8e1; --page-fg: #23251f; --page-sec: #6a6c64; --page-line: rgb(35 37 31 / .1); --page-card: #f8f6f2; --page-acc: #2f6b4c;
  --f-ui: "DM Sans", -apple-system, system-ui, sans-serif; --f-disp: "Fraunces", Georgia, serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #121311; --page-fg: #eceee7; --page-sec: #9b9e94; --page-line: rgb(255 255 255 / .09); --page-card: #1b1d19; --page-acc: #8fd4a7; color-scheme: dark; } }
:root[data-theme="dark"] { --page: #121311; --page-fg: #eceee7; --page-sec: #9b9e94; --page-line: rgb(255 255 255 / .09); --page-card: #1b1d19; --page-acc: #8fd4a7; color-scheme: dark; }
html, body, #root { height: 100%; }
body { margin: 0; background: var(--page); color: var(--page-fg); font-family: var(--f-ui); }
.boot { height: 100%; display: grid; place-items: center; font: 600 15px var(--f-ui); color: var(--page-sec); }

.desk { min-height: 100%; display: flex; align-items: flex-start; justify-content: center; gap: 56px; padding: 20px max(24px, env(safe-area-inset-right, 0px)) 20px max(24px, env(safe-area-inset-left, 0px)); box-sizing: border-box; }
.phone-col { flex: none; display: flex; align-items: center; position: sticky; top: 20px; }
.phone-sz { position: relative; flex: none; }
.dev { position: absolute; left: 0; top: 0; width: 419px; height: 878px; border-radius: 70px; padding: 13px; box-sizing: border-box; background: #0b0b0c; transform-origin: 0 0;
  box-shadow: 0 0 0 1.5px #2e2e31 inset, 0 0 0 3px #19191b, 0 60px 100px -46px rgb(30 20 10 / .5), 0 22px 40px -22px rgb(0 0 0 / .4); }
.dev .di { position: absolute; top: 24px; left: 50%; width: 124px; height: 36px; border-radius: 99px; background: #000; transform: translateX(-50%); z-index: 200; }
.dev .scrn { position: absolute; inset: 13px; border-radius: 57px; overflow: hidden; background: #000; isolation: isolate; }
.dev .scrn > .app { height: 100%; }
.sbar { position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 150; pointer-events: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 32px 0 54px;
  font: 600 16.5px/1 -apple-system, "SF Pro Text", "Inter", system-ui, sans-serif; letter-spacing: -0.02em; color: var(--fg); }
.sbar .r { display: flex; gap: 6px; align-items: center; } .sbar svg { display: block; fill: currentColor; }
.dev.g:has(.scr.top.s-recipe) .sbar, .dev:has(.mdl.m-scan:not(.out)) .sbar.x, .dev.g:has(.mdl.m-scan:not(.out)) .sbar, .dev.g:has(.mdl.m-cook .bgl) .sbar { color: #fff; }
.dev:has(.scr.top .sc.scrolled) .sbar { color: var(--fg); }
.dev.g:has(.mdl:not(.out).m-scan) .sbar { color: #fff; }
.dev .scrn::after { content: ""; position: absolute; bottom: 8px; left: 50%; width: 136px; height: 5px; border-radius: 99px; background: var(--fg); opacity: .85; transform: translateX(-50%); z-index: 150; pointer-events: none; }

.panel { width: 340px; flex: none; display: flex; flex-direction: column; gap: 24px; padding-top: 12px; color: var(--page-fg); }
.panel h1 { font: 500 40px/1.02 var(--f-disp); letter-spacing: -1.2px; margin: 6px 0 10px; font-variation-settings: "opsz" 96; text-wrap: balance; }
.panel h2 { font: 700 12px var(--f-ui); letter-spacing: 1.4px; text-transform: uppercase; color: var(--page-sec); margin: 0 0 10px; }
.panel p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--page-sec); }
.p-k { font: 700 12px var(--f-ui); letter-spacing: 1.4px; text-transform: uppercase; color: var(--page-acc); }
.panel .tpick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.panel .seg { display: flex; background: var(--page-line); border-radius: 99px; padding: 4px; }
.panel .seg button { flex: 1; border: 0; background: none; padding: 9px 0; border-radius: 99px; font: 700 13.5px var(--f-ui); color: var(--page-sec); cursor: pointer; }
.panel .seg button.on { background: var(--page-card); color: var(--page-fg); box-shadow: 0 2px 6px rgb(0 0 0 / .08); }
.p-try { display: flex; flex-direction: column; background: var(--page-card); border-radius: 20px; overflow: hidden; box-shadow: 0 1px 0 var(--page-line); }
.p-try button { display: flex; align-items: center; gap: 12px; border: 0; background: none; padding: 12px 14px; text-align: left; cursor: pointer; color: var(--page-fg); font-family: var(--f-ui); }
.p-try button + button { border-top: 1px solid var(--page-line); }
.p-try button:hover { background: var(--page-line); }
.p-try button > .ico:first-child { width: 22px; height: 22px; color: var(--page-acc); flex: none; }
.p-try button > .ico:last-child { width: 14px; height: 14px; color: var(--page-sec); flex: none; }
.p-try span { flex: 1; display: flex; flex-direction: column; gap: 2px; } .p-try b { font-size: 15px; } .p-try small { font-size: 13px; color: var(--page-sec); }
.p-foot { gap: 12px; display: flex; flex-direction: column; }
.p-ai { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px !important; }
.p-ai i { width: 9px; height: 9px; border-radius: 99px; background: #c9a24a; flex: none; margin-top: 5px; } .p-ai i.ok { background: #3fb36e; }
.p-reset { align-self: flex-start; border: 0; background: none; color: var(--page-sec); font: 600 14px var(--f-ui); display: inline-flex; gap: 8px; align-items: center; cursor: pointer; padding: 6px 0; }
.p-reset .ico { width: 15px; height: 15px; }
.p-confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.p-confirm button { border: 0; border-radius: 99px; padding: 8px 14px; font: 700 13.5px var(--f-ui); cursor: pointer; background: var(--page-line); color: var(--page-fg); }
.p-confirm button.d { background: #c4483d; color: #fff; }
.panel .ico { display: inline-block; } .panel .ico svg { width: 100%; height: 100%; fill: currentColor; display: block; }
.panel :focus-visible { outline: 2px solid var(--page-acc); outline-offset: 2px; }

/* výber témy (panel aj appka) */
.tpick { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tp { display: flex; flex-direction: column; gap: 10px; text-align: left; border: 0; background: none; padding: 0; cursor: pointer; color: inherit; font-family: inherit; }
.tprev { position: relative; height: 128px; border-radius: 22px; overflow: hidden; display: block; box-shadow: 0 0 0 1.5px rgb(0 0 0 / .06); transition: box-shadow .2s, transform .2s; }
.tp.on .tprev { box-shadow: 0 0 0 3px var(--page-acc, var(--acc)); }
.tp:active .tprev { transform: scale(.97); }
.tp-w { background: #f7f3ec; }
.pw-a { position: absolute; left: 14px; top: 14px; font: 450 19px/1.05 "Fraunces", Georgia, serif; color: #22261f; letter-spacing: -0.5px; }
.pw-a em { color: #3d7a59; }
.pw-c { position: absolute; left: 12px; right: 12px; bottom: 12px; height: 40px; border-radius: 14px; background: #26392d; display: flex; align-items: center; gap: 8px; padding: 0 10px; }
.pw-c i { width: 8px; height: 8px; border-radius: 99px; background: #9be3b3; } .pw-c b { height: 6px; flex: 1; border-radius: 99px; background: rgb(255 255 255 / .2); }
.pw-e { position: absolute; right: 12px; top: 12px; width: 40px; height: 40px; border-radius: 99px; background: #f7e3d3; display: grid; place-items: center; }
.tp-g { background: #222; }
.pg-p { position: absolute; inset: 0; background-size: cover; background-position: 30% 20%; }
.pg-c { position: absolute; left: 10px; right: 52px; bottom: 12px; height: 40px; border-radius: 99px; background: rgb(255 255 255 / .55); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); display: flex; align-items: center; gap: 8px; padding: 0 12px; box-shadow: inset 0 1px 0 rgb(255 255 255 / .7); }
.pg-c i { width: 18px; height: 18px; border-radius: 6px; background: #ff6a2b; } .pg-c b { height: 6px; flex: 1; border-radius: 99px; background: rgb(0 0 0 / .18); }
.pg-o { position: absolute; right: 10px; bottom: 12px; width: 36px; height: 36px; border-radius: 99px; background: linear-gradient(160deg, #ff8a4c, #ff6a2b); }
.tpt { display: flex; flex-direction: column; gap: 3px; }
.tpt b { font-size: 15.5px; font-weight: 700; display: flex; align-items: center; gap: 6px; letter-spacing: -0.2px; }
.tpt b .ico { width: 17px; height: 17px; color: var(--page-acc, var(--acc)); }
.tpt small { font-size: 13px; line-height: 1.4; color: var(--page-sec, var(--sec)); }

/* úvodný výber témy */
.intro { position: absolute; inset: 0; z-index: 95; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 24px 22px; animation: fadein .3s; overflow-y: auto; }
.in-wrap { max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 12px; }
.in-k { font-size: 12px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; color: var(--acc); }
.intro h1 { margin: 0; font-size: 30px; line-height: 1.08; letter-spacing: -0.8px; text-wrap: balance; }
.intro p { margin: 0 0 10px; color: var(--sec); font-size: 15.5px; line-height: 1.45; }
.tpick.big { grid-template-columns: 1fr; }
.tpick.big .tp { flex-direction: row; align-items: center; gap: 14px; }
.tpick.big .tprev { width: 120px; height: 120px; flex: none; }

@media (max-width: 1080px) { .desk { gap: 32px; } .panel { width: 300px; } }

.tpick.big .pw-a { font-size: 14px; left: 10px; top: 10px; } .tpick.big .pw-e { width: 30px; height: 30px; right: 8px; top: 8px; } .tpick.big .pw-e .em { width: 20px !important; height: 20px !important; } .tpick.big .pw-c { height: 30px; left: 8px; right: 8px; bottom: 8px; }

/* ================= Spoločná kostra appky (rozloženie, správanie). Farby a tvar dodávajú témy. ================= */
.app { position: relative; height: 100%; width: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 17px; line-height: 1.3; letter-spacing: -0.012em;
  -webkit-font-smoothing: antialiased; --sat: 10px; --sab: 12px; --kb: 0px; isolation: isolate; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.app.framed { --sat: 50px; --sab: 22px; }
.app *, .app *::before, .app *::after { box-sizing: border-box; }
:where(.app) button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; letter-spacing: inherit; -webkit-tap-highlight-color: transparent; }
:where(.app) input, :where(.app) textarea { font: inherit; color: inherit; letter-spacing: inherit; -webkit-user-select: text; user-select: text; border: 0; outline: 0; background: none; min-width: 0; }
:where(.app) input::placeholder, :where(.app) textarea::placeholder { color: var(--ter); }
:where(.app) button:disabled { cursor: default; }
.app :focus-visible { outline: 2.5px solid var(--acc); outline-offset: 2px; }
.app input:focus-visible, .app textarea:focus-visible { outline: none; }
.field:focus-within, .search:focus-within { box-shadow: 0 0 0 2px var(--acc), var(--sh); }
.fl input:focus, .rdict textarea:focus { box-shadow: inset 0 0 0 2px var(--acc); }
:where(.app) :is(h1, h2, p, ol) { margin: 0; }
.ico { display: inline-block; width: 22px; height: 22px; flex: none; }
.ico svg { width: 100%; height: 100%; display: block; fill: currentColor; }
.em { display: inline-block; width: 40px; height: 40px; flex: none; background-size: contain; background-position: center; background-repeat: no-repeat; }
[class*="pic-"] { background-size: cover; background-position: center; }
.grow { flex: 1; min-width: 0; }
.g1 { flex: 1; min-width: 0; }
.rowc { display: flex; align-items: center; gap: 12px; }
.ra { text-align: right; flex: none; }
.c { text-align: center; }
.meta { font-size: 15px; color: var(--sec); letter-spacing: -0.1px; line-height: 1.35; }
.meta.sm { font-size: 13px; }
.k { font-size: 12.5px; font-weight: 700; letter-spacing: 1.1px; text-transform: uppercase; color: var(--sec); }
.k.acc { color: var(--acc); }
.t1 { font-size: 17px; font-weight: 700; letter-spacing: -0.35px; }
.t2 { font-size: 15px; color: var(--sec); }
.ttl { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.15; }
.lnk { color: var(--acc); font-weight: 650; font-size: 15px; display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; }
.lnk .ico { width: 13px; height: 13px; }
.lnk.dng { color: var(--danger); }
.lnk.c { align-self: center; }
.chev { width: 15px !important; height: 15px !important; color: var(--ter); }
.hint { font-size: 13px; color: var(--ter); display: flex; gap: 8px; align-items: center; justify-content: center; text-align: center; padding: 4px 10px; line-height: 1.35; }
.hint .ico { width: 18px; height: 18px; }
.src-note { font-size: 13px; color: var(--ter); text-align: center; padding: 6px 0; }

/* ---------- obrazovky a navigácia ---------- */
.scr { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
.scr.off { visibility: hidden; pointer-events: none; }
.scr.top { z-index: 1; }
/* návrat ťahom z ľavého okraja */
.edgeb { position: absolute; left: 0; top: 0; bottom: 0; width: 18px; z-index: 35; touch-action: pan-y; }
.scr.off.peek { visibility: visible; z-index: 0; }
.scr.peek::after { content: ""; position: absolute; inset: 0; z-index: 60; background: rgb(0 0 0 / var(--dim, 0)); pointer-events: none; }
.sc { position: relative; z-index: 2; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; scrollbar-width: none; }
.sc::-webkit-scrollbar { display: none; }
.body { display: flex; flex-direction: column; gap: 16px; padding: 2px 18px calc(118px + var(--sab)); }
.body > * { flex-shrink: 0; }
.bgl { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.nb { position: sticky; top: 0; z-index: 20; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: calc(var(--sat) + 2px) 16px 8px; transition: background-color var(--dur-2), box-shadow var(--dur-2); }
.nb > :first-child { justify-self: start; } .nb > :last-child { justify-self: end; }
.nbt { font-size: 17px; font-weight: 700; letter-spacing: -0.4px; opacity: 0; transition: opacity var(--dur-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 210px; text-align: center; }
.nbt.sh { opacity: 1; }
.sc.scrolled > .nb { background: var(--navbg); -webkit-backdrop-filter: blur(24px) saturate(1.7); backdrop-filter: blur(24px) saturate(1.7); box-shadow: 0 .5px 0 var(--line2); }
.sc.scrolled > .nb .nbt { opacity: 1; }
.nbr { display: flex; gap: 10px; align-items: center; }
.ibs { width: 44px; height: 44px; }
.nb.over { margin-bottom: calc(-1 * (var(--sat) + 62px)); }
.lt { font-size: 34px; line-height: 1.06; font-weight: 750; letter-spacing: -0.9px; text-wrap: balance; }
.lhead { display: flex; align-items: center; gap: 14px; }
.lhead .lt { font-size: 28px; }

.ib { width: 44px; height: 44px; border-radius: 99px; display: grid; place-items: center; flex: none; background: var(--ibg); box-shadow: var(--ish); color: var(--fg); transition: transform var(--dur-1); }
.ib .ico { width: 20px; height: 20px; }
.ib.sm { width: 36px; height: 36px; } .ib.sm .ico { width: 15px; height: 15px; }
.ib.flat { box-shadow: none; background: var(--card2); }
.ib.faved { color: #e0466a; }
.ib:active { transform: scale(.92); }

.btn { height: 50px; border-radius: 99px; padding: 0 22px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 17px; letter-spacing: -0.25px; white-space: nowrap; flex: none; transition: transform var(--dur-1), opacity var(--dur-2), background-color var(--dur-2); }
.btn .ico { width: 19px; height: 19px; }
.btn.pri { background: var(--pri); color: var(--onpri); box-shadow: var(--prish); }
.btn.soft { background: var(--card2); color: var(--fg); }
.btn.sm { height: 42px; padding: 0 16px; font-size: 15px; }
.btn.big { height: 58px; font-size: 17px; }
.btn.full { width: 100%; } .btn.grow { flex: 1; }
.btn.round { width: 44px; height: 44px; padding: 0; }
.btn.danger { background: var(--danger); color: #fff; }
.btn.danger.soft { background: var(--dangers); color: var(--danger); }
.btn:disabled { opacity: .42; box-shadow: none; }
.btn:active:not(:disabled), .tapc:active, .chip:active, .row.tap:active, .bub:active { transform: scale(.975); }
.tapc { transition: transform var(--dur-1); cursor: pointer; text-align: left; width: 100%; }

/* ---------- karty, zoznamy, riadky ---------- */
.card { background: var(--card); border-radius: var(--rc); box-shadow: var(--sh); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden; }
.row-card { flex-direction: row; align-items: center; gap: 12px; padding: 12px 14px; }
.tile { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--tc, var(--card2)) 24%, var(--card)); }
.tile .em { width: 36px; height: 36px; }
.tile.sm { width: 42px; height: 42px; border-radius: 16px; } .tile.sm .em { width: 28px; height: 28px; }
.tile.lg { width: 64px; height: 64px; border-radius: 22px; }
.stile { display: grid; place-items: center; flex: none; color: #fff; font-weight: 800; letter-spacing: -0.5px; box-shadow: inset 0 1px 0 rgb(255 255 255 / .28), 0 4px 10px -6px rgb(0 0 0 / .4); font-family: var(--fontui, inherit); }
.avs { display: inline-flex; } .avs > i { width: 34px; height: 34px; border-radius: 99px; display: grid; place-items: center; font-style: normal; font-size: 13px; font-weight: 750; color: #fff; margin-left: -9px; box-shadow: 0 0 0 2.5px var(--bg); }
.avs > i:first-child { margin-left: 0; } .avs.sm > i { width: 26px; height: 26px; font-size: 13px; margin-left: -7px; }
.av1 { border-radius: 99px; display: inline-grid; place-items: center; color: #fff; font-weight: 750; flex: none; vertical-align: middle; }
.avbtn { display: flex; padding: 4px 0; }
.dot { width: 8px; height: 8px; border-radius: 99px; background: var(--ok); display: inline-block; margin-left: 7px; vertical-align: 2px; box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 25%, transparent); animation: pulse 1.8s infinite; }

.lst { background: var(--card); border-radius: var(--rl); box-shadow: var(--sh); overflow: hidden; display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; position: relative; width: 100%; min-height: 66px; text-align: left; }
.lst > .row + .row::before, .lst > .swr + .swr::before { content: ""; position: absolute; top: 0; left: 72px; right: 0; height: 1px; background: var(--line); z-index: 3; }
.row.tap { cursor: pointer; transition: transform var(--dur-1), background-color var(--dur-2); }
.th { width: 46px; height: 46px; border-radius: 16px; display: grid; place-items: center; flex: none; background: var(--card2); overflow: hidden; }
.th .em { width: 32px; height: 32px; }
.th.lg { width: 60px; height: 60px; border-radius: 22px; }
.th.ic { color: var(--acc); } .th.ic .ico { width: 22px; height: 22px; }
.tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.tx > b { font-size: 17px; font-weight: 620; letter-spacing: -0.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub { font-size: 13px; color: var(--sec); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; line-height: 1.3; }
.sub .paid { color: var(--acc); font-weight: 700; }
.sub .noprice { color: var(--ter); }
.sub .note { color: var(--honey); font-weight: 600; }
.sub.warn { color: var(--honey); font-weight: 700; }
.mk { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; padding: 2px 8px 2px 7px; border-radius: 99px; background: var(--card2); color: var(--sec); letter-spacing: 0; }
.mk::before { content: ""; width: 6px; height: 6px; border-radius: 99px; background: var(--sc, var(--honey)); }
.mk.ap::before { display: none; }

.stb { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 64px; padding: 10px 6px; border-radius: 16px; font-size: 15px; font-weight: 700;
  background: color-mix(in srgb, var(--sc) 14%, transparent); color: color-mix(in srgb, var(--sc) 70%, var(--fg)); -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--sc) 22%, transparent), inset 0 1px 0 rgb(255 255 255 / .18); transition: box-shadow var(--dur-2), background-color var(--dur-2); }

.stb b { font-size: 15px; font-weight: 750; }

.toast { position: absolute; left: 12px; right: 12px; top: calc(var(--sat) + 4px); z-index: 85; display: flex; align-items: center; gap: 10px; padding: 11px 10px 11px 16px; min-height: 54px; border-radius: 22px;
  background: var(--toastbg); color: var(--toastfg); box-shadow: 0 18px 40px -16px rgb(0 0 0 / .5); animation: toastin var(--dur-3) var(--ease-out); font-size: 15px; font-weight: 600; }

/* ---------- animácie ---------- */
.scr.in-push { animation: pushin var(--dur-4) var(--ease-out); }
.scr.in-pop { animation: popin var(--dur-3) var(--ease-out); }
.scr.in-tab { animation: tabin var(--dur-3) var(--ease-out); }
.mdl { position: absolute; inset: 0; z-index: 50; animation: mdlin var(--dur-4) var(--ease-out); }
.mdl.out { animation: mdlout var(--dur-3) var(--ease-in) forwards; pointer-events: none; }
.mdl > .scr { position: absolute; inset: 0; }
@keyframes pushin { from { transform: translateX(32%); opacity: .3; } }
@keyframes popin { from { transform: translateX(-14%); opacity: .5; } }
@keyframes tabin { from { opacity: 0; transform: translateY(6px); } }
@keyframes mdlin { from { transform: translateY(100%); } }
@keyframes mdlout { to { transform: translateY(100%); } }
@keyframes up { from { transform: translateY(100%); } }
@keyframes down { to { transform: translateY(100%); } }
@keyframes fadein { from { opacity: 0; } }
@keyframes fadeout { to { opacity: 0; } }
@keyframes toastin { from { transform: translateY(-24px) scale(.96); opacity: 0; } }
@keyframes toastout { to { transform: translateY(-16px); opacity: 0; } }
@keyframes flash { 0%, 30% { background-color: var(--accs); } 100% { background-color: transparent; } }
@keyframes collapse { to { max-height: 0; opacity: 0; transform: translateX(-30%); } }
@keyframes pop { from { transform: scale(.4); } }
@keyframes fill2 { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--ok) 0%, transparent); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes breathe { 50% { transform: scale(1.08); } }
@keyframes shimmer { from { background-position: -200px 0; } to { background-position: 200px 0; } }
.swr { max-height: 120px; }
@media (prefers-reduced-motion: reduce) { .app *, .app *::before, .app *::after { animation-duration: var(--dur-1) !important; animation-iteration-count: 1 !important; transition-duration: var(--dur-1) !important; } }

/* bublina: [−] ikona · názov / cena · počet v zozname */
.bb { flex: none; position: relative; height: 48px; max-width: 232px; display: inline-flex; align-items: center; border-radius: 18px;
  background: var(--card); box-shadow: var(--sh); transition: transform 300ms var(--ease-spring), box-shadow var(--dur-2), background-color var(--dur-2);
  user-select: none; -webkit-user-select: none; }
.bb:active { transform: scale(.94); transition-duration: 80ms; }
.bb-m { height: 100%; min-width: 0; display: inline-flex; align-items: center; gap: 9px; padding: 0 14px 0 9px; border-radius: inherit; text-align: left; color: inherit;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

/* napísaný text, ktorý nepoznáme („+ „ban““) */
.bb-n { min-width: 26px; height: 26px; padding: 0 7px; margin-left: 2px; border-radius: 99px; display: grid; place-items: center; flex: none;
  background: var(--card2); color: var(--sec); font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; animation: bb-pop 420ms var(--ease-spring); }
/* posledná ťuknutá bublina: zelený okraj, mínus, číslo v plnej farbe */
.bb.act { background: color-mix(in srgb, var(--acc) 15%, var(--card)); box-shadow: inset 0 0 0 2px var(--acc), var(--sh); }
.bb.act .bb-m { padding-left: 2px; }

.bb-min { flex: none; width: 38px; height: 42px; margin-left: 3px; border-radius: 14px; display: grid; place-items: center; color: var(--acc);
  animation: bb-min 300ms var(--ease-spring); touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.bb-min:active { background: color-mix(in srgb, var(--acc) 18%, transparent); }
.bb-min .ico { width: 16px; height: 16px; }
.bb.typed { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line2, var(--line)); }
@keyframes bb-pop { 0% { transform: scale(.5); opacity: 0; } 60% { transform: scale(1.22); opacity: 1; } 100% { transform: none; } }
@keyframes bb-min { from { opacity: 0; transform: scale(.4); } }

/* ================= Zosúladenie dizajnu: sklo, veľkosti písma, ikon a dotykových plôch =================
   Pravidlá podľa Apple Human Interface Guidelines (iPhone):
   – písmo: nadpis 34, titulok 28/22/20, tučný riadok 17, text 17, menší text 16/15, poznámka 13, popis min. 12 (lišta 11);
   – dotyková plocha min. 44 × 44 bodov (aj keď je tlačidlo opticky menšie);
   – ikony: na lište 26, v tlačidlách navigácie 22, v tlačidlách s textom 20, pri texte 16–18;
   – sklo („materiál“): rozmazanie 30–40 px so sýtosťou, tenký svetlý okraj a jemný odlesk zhora. */

/* ---------- materiály skla (tokeny pre obe témy) ---------- */
.g { --mat: rgb(255 255 255 / .56); --mat-thick: rgb(248 247 245 / .8); --mat-blur: blur(36px) saturate(1.9);
  --mat-edge: inset 0 0 0 .5px rgb(255 255 255 / .75), inset 0 1px 0 rgb(255 255 255 / .95);
  --mat-spec: linear-gradient(180deg, rgb(255 255 255 / .38), rgb(255 255 255 / .08) 42%, rgb(255 255 255 / 0) 70%);
  --mat-out: 0 0 0 .5px rgb(0 0 0 / .06), 0 14px 34px -18px rgb(40 25 10 / .45);
  --fade: rgb(243 242 240 / .78);
  --toastbg: rgb(24 24 27 / .84); --toastfg: #fff; --toastacc: #ff9a63; }
.g.t-d { --mat: rgb(34 34 38 / .5); --mat-thick: rgb(26 26 30 / .78);
  --mat-edge: inset 0 0 0 .5px rgb(255 255 255 / .14), inset 0 1px 0 rgb(255 255 255 / .2);
  --mat-spec: linear-gradient(180deg, rgb(255 255 255 / .11), rgb(255 255 255 / .02) 42%, rgb(255 255 255 / 0) 70%);
  --mat-out: 0 0 0 .5px rgb(0 0 0 / .4), 0 16px 36px -16px rgb(0 0 0 / .85);
  --fade: rgb(5 5 6 / .7);
  --toastbg: rgb(44 44 48 / .86); --toastfg: #fff; --toastacc: #ff9a63; }
.w { --mat: rgb(255 252 246 / .62); --mat-thick: rgb(250 246 239 / .84); --mat-blur: blur(30px) saturate(1.6);
  --mat-edge: inset 0 0 0 .5px rgb(255 255 255 / .85), inset 0 1px 0 rgb(255 255 255 / 1);
  --mat-spec: linear-gradient(180deg, rgb(255 255 255 / .45), rgb(255 255 255 / .1) 42%, rgb(255 255 255 / 0) 70%);
  --mat-out: 0 0 0 .5px rgb(70 55 30 / .1), 0 16px 34px -18px rgb(70 55 30 / .42);
  --fade: rgb(247 243 236 / .8);
  --toastbg: rgb(31 45 36 / .9); --toastfg: #f7f3ec; --toastacc: #9be3b3; }
.w.t-d { --mat: rgb(32 36 29 / .56); --mat-thick: rgb(24 27 21 / .82);
  --mat-edge: inset 0 0 0 .5px rgb(255 255 255 / .1), inset 0 1px 0 rgb(255 255 255 / .14);
  --mat-spec: linear-gradient(180deg, rgb(255 255 255 / .08), rgb(255 255 255 / 0) 50%);
  --mat-out: 0 0 0 .5px rgb(0 0 0 / .5), 0 16px 34px -16px rgb(0 0 0 / .9);
  --fade: rgb(17 19 15 / .72);
  --toastbg: rgb(40 46 36 / .88); --toastfg: #eef0e8; --toastacc: #9be3b3; }

/* spoločný „materiál“: sklo s odleskom a tenkým okrajom */
.tabbar, .app .sc.scrolled > .nb, .dock .dockc, .seg, .toast, .tst-top .ib, .w .ib:not(.flat):not(.wg), .w .back:not(.wg), .g .back:not(.wg) {
  -webkit-backdrop-filter: var(--mat-blur); backdrop-filter: var(--mat-blur); }
.tabbar { background: var(--mat-spec), var(--mat) !important; box-shadow: var(--mat-edge), var(--mat-out) !important; }
.app .sc.scrolled > .nb { background: var(--mat-thick); box-shadow: 0 .5px 0 var(--line2); }
.dock .dockc { background: var(--mat-spec), var(--mat-thick); box-shadow: var(--mat-edge), var(--mat-out); }
.w .ib:not(.flat):not(.wg), .w .back:not(.wg), .g .back:not(.wg) { background: var(--mat-spec), var(--mat); box-shadow: var(--mat-edge), var(--mat-out); }
.seg { background: color-mix(in srgb, var(--fg) 7%, transparent); box-shadow: inset 0 0 0 .5px var(--line); }
.seg > button.on { background: var(--mat-spec), var(--segon); box-shadow: var(--mat-edge), 0 3px 10px -4px rgb(0 0 0 / .25); }
/* fotky a sklo: karty a zoznamy dostanú rovnaký odlesk ako lišta */
.g .card, .g .lst, .g .glass2, .g .qab, .g .acts2 > button, .g .pager > button, .g .chip:not(.on), .g .search, .g .field { background-image: var(--mat-spec); box-shadow: var(--mat-edge), var(--shade); }
/* panel zdola (sheet) ako hrubé sklo */
.sheet { background: var(--mat-spec), var(--mat-thick); -webkit-backdrop-filter: blur(44px) saturate(1.8); backdrop-filter: blur(44px) saturate(1.8); box-shadow: var(--mat-edge), 0 -10px 40px -10px rgb(0 0 0 / .35); }
.w .vsheet { background: var(--mat-spec), var(--mat-thick); -webkit-backdrop-filter: blur(44px) saturate(1.6); backdrop-filter: blur(44px) saturate(1.6); box-shadow: var(--mat-edge); }

/* obsah pod spodnou lištou a dokom sa plynulo stráca do skla (namiesto ostrého prekrytia) */
.tabfade { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--sab) + 108px); z-index: 29; pointer-events: none;
  background: linear-gradient(180deg, transparent, var(--fade) 72%);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  -webkit-mask-image: linear-gradient(180deg, transparent, #000 55%); mask-image: linear-gradient(180deg, transparent, #000 55%); }
.dock { background: none !important; }
.dock::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: linear-gradient(180deg, transparent, var(--fade) 60%);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  -webkit-mask-image: linear-gradient(180deg, transparent, #000 40%); mask-image: linear-gradient(180deg, transparent, #000 40%); }

/* ---------- správy (toast): tmavšie sklo, dobre čitateľné v oboch vzhľadoch ---------- */
.toast { background: var(--mat-spec), var(--toastbg); color: var(--toastfg); box-shadow: inset 0 0 0 .5px rgb(255 255 255 / .14), inset 0 1px 0 rgb(255 255 255 / .16), 0 20px 44px -16px rgb(0 0 0 / .6);
  -webkit-backdrop-filter: blur(30px) saturate(1.8); backdrop-filter: blur(30px) saturate(1.8); font-size: 15px; min-height: 56px; }
.toast > .ico { width: 22px; height: 22px; color: var(--toastacc); }
.toast button { height: 36px; background: rgb(255 255 255 / .16); color: #fff; }
/* tip a výzvy v zozname: o niečo tmavší a pokojnejší podklad */
.tip { background: color-mix(in srgb, var(--acc) 14%, var(--card)); box-shadow: inset 0 0 0 .5px color-mix(in srgb, var(--acc) 30%, transparent); }
.g .tip { background: var(--mat-spec), color-mix(in srgb, var(--acc) 16%, var(--mat-thick)); -webkit-backdrop-filter: var(--mat-blur); backdrop-filter: var(--mat-blur); }
.w .tip { background: color-mix(in srgb, var(--acc) 12%, var(--card)); }

/* ---------- písmo: jednotná stupnica ---------- */
.t1 { font-size: 17px; }
.t2, .meta { font-size: 15px; }
.meta.sm, .hint, .src-note, .aimeta { font-size: 13px; }
.tx > b { font-size: 17px; }
.sub { font-size: 15px; }
.seg > button { font-size: 15px; }
.chip { font-size: 15px; }
.facts > span { font-size: 15px; }
.h2 .a, .lnk, .tipx, .kbt { font-size: 15px; }
.steps p, .bsteps p { font-size: 17px; }
.sbx { font-size: 15px; }
.binfo.grid p { font-size: 15px; }
/* drobné popisy nikdy pod 12 bodov (okrem spodnej lišty, tam 11 ako v iOS) */
.mk, .bub small, .ing .lbl, .rok, .ar3 small, .pager small, .okb, .raib, .aib.sm, .gal-l, .bfree, .vchip small, .tst-tags .tg, .tr-b, .bm-min, .g .ring > span > small, .w .rc .badge, .rpos, .diff { font-size: 13px; }
.pchart .axl { font-size: 13px; }
.g .tabbar > button, .w .tabbar > button { font-size: 13px; font-weight: 650; }
.g .tabs > button { font-size: 13px; }

/* ---------- ikony ---------- */
.g .tabbar > button .ico, .w .tabbar > button .ico { width: 26px; height: 26px; }
.ib .ico { width: 22px; height: 22px; }
.btn .ico, .g .pb .ico { width: 20px; height: 20px; }
.lnk .ico { width: 15px; height: 15px; }

/* ===== Okná nápovedy a sprievodcu: obrátený povrch, aby nesplývali s témou =====
   Tmavý režim → svetlé „papierové“ okno s tmavým textom; svetlý režim → tmavé okno so svetlým textom.
   Farby vnútri okna sa berú z rovnakých rolí (--fg, --sec, --acc, --pri…), len prepnutých pre tento povrch. */
.app.t-d { --gs-bg: #fbf8f2; --gs-fg: #1c1a17; --gs-sec: rgb(28 26 23 / .68); --gs-ter: rgb(28 26 23 / .42); --gs-line: rgb(28 26 23 / .1); --gs-out: rgb(0 0 0 / .55); }
.app.g.t-d { --gs-acc: #d9531a; --gs-btn: linear-gradient(160deg, #ff8a4c, #e9571a); --gs-onbtn: #fff; }
.app.w.t-d { --gs-acc: #2f6b4a; --gs-btn: #2f6b4a; --gs-onbtn: #fff; }
.app.t-l { --gs-fg: #fff; --gs-sec: rgb(255 255 255 / .74); --gs-ter: rgb(255 255 255 / .45); --gs-line: rgb(255 255 255 / .12); --gs-out: rgb(20 16 10 / .35); }
.app.g.t-l { --gs-bg: #221e1a; --gs-acc: #ff9a63; --gs-btn: linear-gradient(160deg, #ff8a4c, #f2601f); --gs-onbtn: #fff; }
.app.w.t-l { --gs-bg: #1d2a22; --gs-acc: #8fd4a7; --gs-btn: #8fd4a7; --gs-onbtn: #0f1a13; }
#tx .tx-card, #tx .tx-chcard, #tx .tx-dlg, #tx .tx-sheet, #tx .tx-paused, #tx .tx-label, .coach .co-bub, .co-wel .co-wcard {
  --fg: var(--gs-fg); --sec: var(--gs-sec); --ter: var(--gs-ter); --line: var(--gs-line); --acc: var(--gs-acc); --pri: var(--gs-btn); --onpri: var(--gs-onbtn); --mat-thick: var(--gs-bg);
  background: var(--gs-bg) !important; color: var(--gs-fg); -webkit-backdrop-filter: none !important; backdrop-filter: none !important;
  box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--gs-acc) 55%, transparent), 0 28px 70px -22px var(--gs-out), 0 10px 24px -12px var(--gs-out) !important; }
#tx .tx-sheet { box-shadow: 0 -1.5px 0 0 color-mix(in srgb, var(--gs-acc) 55%, transparent), 0 -24px 60px -20px var(--gs-out) !important; }
#tx .tx-paused { box-shadow: 0 0 0 1.5px var(--gs-acc), 0 18px 40px -14px var(--gs-out) !important; }
.coach .co-arr { background: var(--gs-bg) !important; box-shadow: none !important; }
/* tlačidlá a štítky v okne */
#tx .tx-card .tx-ok, #tx .tx-chcard .tx-wide.p, #tx .tx-dlg .tx-wide.p, #tx .tx-sheet .tx-wide.p, #tx .tx-paused .go, .coach .co-ok { background: var(--gs-btn) !important; color: var(--gs-onbtn) !important; box-shadow: 0 10px 22px -12px color-mix(in srgb, var(--gs-acc) 80%, transparent) !important; }
#tx .tx-chap .n, #tx .tx-big .num { background: var(--gs-btn); color: var(--gs-onbtn); }
#tx .tx-chap.ok .n { background: #2fb36a; color: #fff; }
#tx .tx-ghost.hot { background: var(--gs-acc); color: var(--gs-onbtn); }
#tx .tx-card .tx-prog i:not(.d):not(.c), #tx .tx-chcard .tx-prog i:not(.d):not(.c) { background: color-mix(in srgb, var(--gs-fg) 14%, transparent); }
.app.t-d #tx .tx-nudge { background: #fdecc8; color: #3a2a07; } .app.t-d #tx .tx-nudge .ico { color: #b7790f; }
.coach .co-bub p, .coach .co-skip { color: var(--gs-sec); } .coach .co-k { color: var(--gs-acc); }
/* zvýraznené miesto: čistý biely okraj + prstenec v akcentovej farbe témy */
#tx .tx-ring { border-color: var(--gs-acc); }
/* pozvánka odkazom (Viac → Pozvať do domácnosti) */
.invite .link { flex: 1 1 180px; min-width: 0; font-size: 15px; font-weight: 600; padding: 9px 12px; border-radius: 12px; background: var(--card2); color: var(--fg); overflow-wrap: anywhere; }

/* ===== Systém pohybu (revízia 2. 11.): 5 dĺžok, 3 krivky ===== */
.app, .desk { --dur-1: 100ms; --dur-2: 180ms; --dur-3: 280ms; --dur-4: 420ms; --dur-5: 600ms;
  --ease-out: cubic-bezier(.2, .8, .2, 1); --ease-in: cubic-bezier(.4, 0, 1, 1); --ease-spring: cubic-bezier(.34, 1.3, .64, 1); }
@media (prefers-reduced-motion: reduce) {
  .app *, .app *::before, .app *::after { animation-duration: 120ms !important; animation-iteration-count: 1 !important; transition-duration: 120ms !important; }
}

/* ===== Čitateľnosť (revízia 2. 11.): druhoradý text aspoň 4,5 : 1, tlačidlá s bielym textom ~4,8 : 1 ===== */
.w { --sec: #5d6157; --ter: #6b6f65; }
.w.t-d { --sec: #b3b8ab; --ter: #959a8d; }
.g { --sec: rgb(17 17 19 / .68); --ter: rgb(17 17 19 / .6); --acc: #b9430d; --pri: linear-gradient(180deg, #dc5a1c, #bf440d); --prish: 0 12px 24px -12px rgb(191 68 13 / .75), inset 0 1px 0 rgb(255 255 255 / .25); }
.g.t-d { --sec: rgb(255 255 255 / .72); --ter: rgb(255 255 255 / .56); --acc: #ff8a52; --pri: linear-gradient(180deg, #dc5a1c, #bf440d); }
.tabbar button { font-size: 12.5px; font-weight: 700; }

/* Stavové farby čitateľné aj na svetlom skle */
.g { --honey: #965806; --danger: #c2353b; --ok: #13804a; }
.w { --honey: #8a5512; --danger: #b23a30; --acc: #346b4e; }
.stgrid button small { opacity: 1 !important; color: inherit !important; font-weight: 650; }
.k small { font-size: 13px; }

/* ===== Ťukacie plochy aspoň 44 × 44 (revízia 2. 11.) ===== */
.qty { min-height: 44px; }
.lst .row .more { min-width: 44px; min-height: 44px; }
button.group { min-height: 44px; }
.seg > button, .seg button { min-height: 44px; }
.step button { width: 44px; height: 44px; }
.vx-try { min-height: 44px; }
.chip.plain, .days .chip { min-height: 44px; }
.search .m, form.search button { min-width: 44px; min-height: 44px; }
.lnk { min-height: 44px; display: inline-flex; align-items: center; }
.cbx, .tgl, .gal-d button { position: relative; }
.cbx::after { content: ""; position: absolute; inset: -7px; }
.tgl::after { content: ""; position: absolute; inset: -7px -2px; }
.gal-d button::after { content: ""; position: absolute; inset: -18px -6px; }
.mebtn { position: relative; }
.mebtn .mdot { position: absolute; top: 1px; right: 1px; width: 11px; height: 11px; border-radius: 99px; background: #d93a32; box-shadow: 0 0 0 2px var(--bg); }
/* Sledovanie: len stav, nie tlačidlo */
.fstat { width: 28px; height: 28px; border-radius: 99px; display: grid; place-items: center; flex: none; background: var(--ok); color: #fff; }
.fstat .ico { width: 15px; height: 15px; } .fstat.no { background: none; }
.t-d .fstat { color: #0f1a13; }
.tst-top .helpb { background: rgb(0 0 0 / .32); color: #fff; -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.tx-chl.one { grid-template-columns: 1fr; } .tx-chl em { font-style: normal; color: var(--sec); font-weight: 500; }
.g { --honey: #8a5105; --acc: #ab3e0c; --sec: rgb(17 17 19 / .72); --ter: rgb(17 17 19 / .64); }
.g.t-d { --acc: #ff8a52; --honey: #ffb057; }
.chip.plain, .days .chip, .tst-open { min-height: 44px !important; }
.cond.bud { min-height: 44px; display: inline-flex; align-items: center; }

/* ===== Sprievodca a nápovedy: bezpečné okraje, zalamovanie, malé displeje (3. 11.) ===== */
.app { --sa-t: env(safe-area-inset-top, 0px); --sa-b: env(safe-area-inset-bottom, 0px); }
.sa-probe { position: absolute; top: 0; left: 0; width: 0; height: 0; padding-top: var(--sa-t); padding-bottom: var(--sa-b); visibility: hidden; pointer-events: none; }
#tx .tx-full { padding-top: max(56px, calc(var(--sa-t) + 28px)); padding-bottom: calc(22px + var(--sa-b)); }
#tx .tx-sheet { padding-bottom: calc(22px + var(--sa-b)); }
#tx .tx-chcard { max-height: calc(100% - var(--sa-t) - var(--sa-b) - 40px); }
#tx .tx-card b.t, #tx .tx-h1, #tx .tx-h2, .coach .co-bub b { text-wrap: balance; }
#tx .tx-card p, #tx .tx-lede, #tx .tx-learn div, .coach .co-bub p, #tx .tx-note span { text-wrap: pretty; overflow-wrap: break-word; hyphens: manual; }
#tx .tx-ok, #tx .tx-ghost, #tx .tx-skip, #tx .tx-x, #tx .tx-wide, .coach .co-ok, .coach .co-skip, #tx .tx-chap { white-space: nowrap; }
#tx .tx-play { min-width: 0; } #tx .tx-play > span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#tx .tx-act { flex-wrap: nowrap; } #tx .tx-btns { flex: none; }
#tx .tx-top { min-height: 30px; } #tx .tx-chap { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
/* menší displej (napr. iPhone SE, appka v okne Claude) */
@media (max-height: 760px) {
  #tx .tx-full { gap: 10px; padding-top: max(36px, calc(var(--sa-t) + 18px)); }
  #tx .tx-logo { width: 56px; height: 56px; border-radius: 18px; } #tx .tx-logo .ico { width: 30px !important; height: 30px !important; }
  #tx .tx-h1 { font-size: 28px; } #tx .tx-lede { font-size: 15px; }
  #tx .tx-opt { padding: 11px 12px; } #tx .tx-opt .ot span:not(.badge) { font-size: 13px; }
  #tx .tx-chl div { min-height: 30px; font-size: 13px; }
  #tx .tx-wide { min-height: 50px; }
  #tx .tx-full.end { padding-top: max(40px, calc(var(--sa-t) + 20px)); }
  #tx .tx-sheet { gap: 9px; } #tx .tx-sheet .tx-lede { font-size: 15px; }
  #tx .tx-chcard { padding: 20px 18px 14px; gap: 10px; } #tx .tx-big .num { width: 52px; height: 52px; }
}

/* ===== Návrhy pri písaní položky (3. 11.): zoznam riadkov s celým názvom, nie mriežka s odrezaným textom ===== */
.sgl { display: flex; flex-direction: column; border-radius: 22px; background: var(--card); box-shadow: var(--sh); overflow: hidden; max-height: min(46vh, 300px); overflow-y: auto; overscroll-behavior: contain; }
.sgr { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 12px 8px 10px; text-align: left; color: var(--fg); width: 100%; border: 0; background: none; font: inherit; cursor: pointer; }
.sgr + .sgr { border-top: 1px solid var(--line); }
.sgr:active { background: color-mix(in srgb, var(--fg) 6%, transparent); }
.sgr.ent { background: color-mix(in srgb, var(--acc) 9%, transparent); }
.sgi { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--fg) 6%, transparent); }
.sgi.nwi { background: var(--accs); color: var(--acc); } .sgi .ico { width: 18px; height: 18px; }
.sgt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.sgt b { font-size: 16px; font-weight: 650; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.sgt small { font-size: 13px; color: var(--sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sgp { flex: none; font-size: 15px; font-weight: 650; color: var(--sec); font-variant-numeric: tabular-nums; }
.sgr kbd { flex: none; min-width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font: 750 15px/1 inherit; font-family: inherit; background: var(--accs); color: var(--acc); }
.sgr.typo small { color: var(--honey); font-weight: 650; }
.g .sgl { border-radius: 24px; }

/* =====================================================================================================
 * Revízia 3. 11. 2026 – farby a hierarchia oboch tém (obe témy ostávajú, len lepšie)
 * Teplá kuchyňa: karta sa nelíšila od pozadia (1,09 : 1) a hlavná farba bola takmer čierna – teraz
 *   hlbšie ovsené pozadie, biele karty s jemným okrajom, akcia stredná lesná zelená (bazalka, biely
 *   text 6,3 : 1), jemný šalviový nádych hore (aj systémová lišta a pripnutá hlavička).
 * Fotky a sklo: signálna oranžová #DC5A1C (biely text 3,8 : 1) → pokojnejšia terakotová
 *   #C25226 → #A8441F (4,6 – 6 : 1), hustejší závoj nad fotkou, aby fotka nekričala.
 * Hierarchia: na obrazovke najviac jedno plné tlačidlo – opakované akcie v riadkoch (košík na karte
 *   zoznamu, Odfotiť pri chýbajúcom bločku, ▶ Variť, ikony v Rýchlo) sú tónové.
 * ===================================================================================================== */
.w { --bg: #f2ece2; --card: #ffffff; --card2: #efe8dc; --line: #ebe4d8; --rowbg: #ffffff; --segon: #ffffff; --ibg: #ffffff; --sheetbg: #f4efe6;
  --pri: #2f6b4f; --onpri: #ffffff; --acc: #2f6b4f; --accs: #e2eee5; --selbg: #e4eee7; --forest: #1f4433; --ter: #63675d;
  --prish: 0 10px 20px -12px rgb(30 70 50 / .75);
  --sh: 0 0 0 1px rgb(70 55 30 / .06), 0 1px 2px rgb(70 55 30 / .05), 0 10px 26px -18px rgb(70 55 30 / .32);
  --tint: #e5ece1; --navbg: rgb(229 236 225 / .86);
  --mat: rgb(255 255 255 / .66); --mat-thick: rgb(246 242 235 / .86); }
.w.t-d { --card: #1d211b; --card2: #282d24; --rowbg: #1d211b; --ibg: #21251e; --segon: #343a30; --forest: #1f3d2c; --ter: #959a8d;
  --pri: #8fd4a7; --onpri: #0f1a13; --acc: #8fd4a7; --accs: #1f3427; --selbg: #1f3026;
  --prish: 0 10px 22px -12px rgb(0 0 0 / .8);
  --sh: 0 0 0 1px rgb(255 255 255 / .05), 0 14px 30px -18px rgb(0 0 0 / .9);
  --tint: #152019; --navbg: rgb(21 32 25 / .86);
  --mat: rgb(32 36 29 / .6); --mat-thick: rgb(24 27 21 / .86); }
/* Šalviový nádych hore obrazovky (posúva sa s obsahom). */
.w .sc { background: linear-gradient(180deg, var(--tint) 0, color-mix(in srgb, var(--tint) 40%, var(--bg)) 160px, var(--bg) 320px) local; }
.w .live { box-shadow: 0 18px 34px -20px rgb(20 50 35 / .8); }

.g { --pri: linear-gradient(180deg, #c25226, #a8441f); --prish: 0 10px 22px -12px rgb(168 68 31 / .7), inset 0 1px 0 rgb(255 255 255 / .22);
  --acc: #a3401c; --acc2: #c8643a; --accs: rgb(194 82 38 / .12); --selbg: rgb(194 82 38 / .1); --toastacc: #f2a27c; --veil: rgb(246 244 240 / .68); }
.g.t-d { --pri: linear-gradient(180deg, #c25226, #a8441f); --acc: #f29a70; --acc2: #e0794a; --accs: rgb(242 154 112 / .16); --selbg: rgb(242 154 112 / .12); --toastacc: #c25226; --veil: rgb(6 6 8 / .62); }
.g .tx-ok, .g .tx-paused .go, .g .tx-fs .go, .g .tx-wide.p { background: var(--pri); }
.tx-logo, .tx-big .num { background: linear-gradient(160deg, #c8643a, #a8441f); box-shadow: 0 18px 40px -16px rgb(168 68 31 / .8); }
.w .tx-logo, .w .tx-big .num { background: var(--pri); }
.g .ph.noph { background: linear-gradient(160deg, #e7a07c, #b24a22); }
/* Náhľady tém vo Viac – rovnaké farby ako témy. */
.pw-a em { color: #2f6b4f; } .pw-c { background: #2f6b4f; } .tp-w { background: #f2ece2; }
.pg-c i { background: #c25226; } .pg-o { background: linear-gradient(160deg, #c8643a, #a8441f); }

/* Opakované akcie v riadkoch: tónové, nie plné. */
.lgo { background: var(--accs); color: var(--acc); box-shadow: none; }
.g .lgo { background: color-mix(in srgb, var(--acc) 14%, var(--glass2)); }
.hplay { background: var(--accs); color: var(--acc); box-shadow: none; }
.hqab .qi, .w .hqab .qi, .g .hqab .qi { background: var(--accs); color: var(--acc); }
.app.g.t-d { --gs-acc: #c25226; --gs-btn: linear-gradient(180deg, #c25226, #a8441f); }
.app.g.t-l { --gs-acc: #f29a70; --gs-btn: linear-gradient(180deg, #c25226, #a8441f); }
/* Ochutnávač: farby témy namiesto fialovej. */
.tentry { background: var(--forest, #1c1714); }
.tentry::before { background: radial-gradient(circle at 15% 50%, rgb(155 227 179 / .22), transparent 60%); }
.g .tentry { background: #1c1714; }
.g .tentry::before { background: radial-gradient(circle at 15% 50%, rgb(194 82 38 / .42), transparent 60%); }
/* Riadky s nebezpečnou / hlavnou akciou (Odhlásiť, Odísť z domácnosti, Pozvať). */
.tx > b.dng, .th.ic.dng { color: var(--danger); }
.th.ic.dng { background: var(--dangers); }
.tx > b.acc { color: var(--acc); }

/* =====================================================================================================
 * Hlas 2.0 (etapa 4, 3. 11. 2026): mikrofón je tlačidlo s ikonou (nie guľa bez významu), prstenec dýcha
 * podľa skutočnej hlasitosti (--lvl 0–1 nastavuje appka), stav s farebnou bodkou (počúvam / počujem /
 * spracúvam / pauza), pod tlačidlami jedna veta, čo robí ťuk; príklady sú len text.
 * ===================================================================================================== */
.vx-orb, .w .vx-orb { width: 78px; height: 78px; display: grid; place-items: center; background: var(--pri); color: var(--onpri);
  box-shadow: 0 0 0 calc(7px + var(--lvl, 0) * 20px) color-mix(in srgb, var(--acc) 18%, transparent), 0 14px 30px -12px rgb(0 0 0 / .45);
  transition: transform var(--dur-2), box-shadow 90ms linear, background-color var(--dur-3), color var(--dur-3); }
.vx-orb .ico { width: 32px; height: 32px; }
.vx-orb:not(.on), .w .vx-orb:not(.on) { filter: none; background: var(--card); color: var(--sec); box-shadow: inset 0 0 0 1.5px var(--line2), var(--sh); }
.vx-orb.on::after { inset: -12px; border-color: color-mix(in srgb, var(--acc) 30%, transparent); }
.vx-orb.hear::after { animation: none; opacity: 0; }
.vx-orb.edit, .w .vx-orb.edit { background: var(--honey); color: #fff; }
.vx-heard small { display: inline-flex; align-items: center; gap: 7px; }
.vx-heard small::before { content: ""; width: 8px; height: 8px; border-radius: 99px; background: var(--ter); flex: none; }
.vx-heard.st-listen small::before { background: var(--ok); }
.vx-heard.st-hear small { color: var(--fg); }
.vx-heard.st-hear small::before { background: var(--danger); animation: pulse 1.2s ease-in-out infinite; }
.vx-heard.st-think small::before { background: var(--honey); animation: pulse 1.2s ease-in-out infinite; }
.vx-heard.st-edit small::before { background: var(--acc); }
.vx-cap { margin: -2px 0 0; text-align: center; font-size: 13px; line-height: 1.35; color: var(--sec); }
.vx-exl { display: flex; flex-direction: column; gap: 6px; margin-top: 18px; align-items: center; }
.vx-exl small { font-size: 12.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--ter); }
.vx-exl p { margin: 0; font-size: 16px; line-height: 1.35; color: var(--sec); font-style: italic; }
.w .vx-exl p { font-family: var(--serif); font-size: 17px; }
.vx-done { white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .vx-heard small::before { animation: none !important; } }
/* Nákupy: skupiny zoznamov podľa dňa (Dnes · Tento týždeň · Neskôr) a zbalené prázdne zoznamy. */
.hub-g { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 4px -4px; font-size: 12.5px; font-weight: 700; letter-spacing: 1.1px; text-transform: uppercase; color: var(--sec); text-align: left; width: calc(100% - 8px); }
button.hub-g { min-height: 44px; margin-top: 2px; }

/* Domov: dlhý úsek podnadpisu (napr. názov zoznamu) sa skráti tromi bodkami, nepretečie cez tlačidlo vpravo. */
.hrow .grow { min-width: 0; }
.hrow small .nw { display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; }

/* =====================================================================================================
 * Finálny vzhľad (11. 11. 2026) – aby appka pôsobila ako hotový produkt, nie ako ukážka.
 * Farby oboch tém ostávajú (Teplá kuchyňa, Fotky a sklo; svetlý aj tmavý). Pribudla hĺbka, materiál a pohyb:
 *  – povrchy: vrstvený mäkký tieň (blízky + ďaleký), svetlá hrana zhora, jemný odlesk; sklo s diagonálnym
 *    odleskom a svetlom aj na spodnej hrane (ako hrubé sklo);
 *  – tlačidlá: hlavné s prechodom, odleskom a farebným tieňom, tónové s hranou; pružné stlačenie a návrat;
 *  – ikony v dlaždiciach: farebné „kamienky“ s prechodom a vnútorným svetlom, 3D emoji s mäkkým tieňom;
 *  – spodná lišta: aktívna záložka s podkladom, ktorý naskočí, mikrofón ako hlavné tlačidlo appky;
 *  – texty: dlhé názvy na dva riadky namiesto „Tok náku…“, nič nepreteká cez dlaždice ani tlačidlá;
 *  – pohyb: obsah obrazovky nastúpi postupne, prepínač má posuvného jazdca, odznaky a dlaždice pružia.
 * Prenáša sa do appky skriptom do-appky.py (ako ostatné súbory prototyp/css). Pri „obmedziť pohyb“ bez animácií.
 * ===================================================================================================== */

/* ---------- tokeny: tiene a svetlo pre každú tému ---------- */
.w { --f-ink: 84 62 30;
  --sh: inset 0 1px 0 rgb(255 255 255 / .9), 0 0 0 1px rgb(var(--f-ink) / .06), 0 1px 2px rgb(var(--f-ink) / .05), 0 6px 14px -8px rgb(var(--f-ink) / .12), 0 22px 40px -24px rgb(var(--f-ink) / .34);
  --sh-hi: inset 0 1px 0 rgb(255 255 255 / .9), 0 0 0 1px rgb(var(--f-ink) / .07), 0 2px 4px rgb(var(--f-ink) / .06), 0 10px 22px -10px rgb(var(--f-ink) / .18), 0 30px 54px -28px rgb(var(--f-ink) / .4);
  --ish: inset 0 1px 0 rgb(255 255 255 / .9), 0 0 0 1px rgb(var(--f-ink) / .07), 0 2px 6px -2px rgb(var(--f-ink) / .12), 0 10px 20px -12px rgb(var(--f-ink) / .3);
  --f-sheen: linear-gradient(180deg, rgb(255 255 255 / .7), rgb(255 255 255 / 0) 58%);
  --f-chip-hi: inset 0 1px 0 rgb(255 255 255 / .75);
  --f-pri: linear-gradient(180deg, #3b8160 0%, #2f6b4f 52%, #285c44 100%);
  --f-pri-sh: inset 0 1px 0 rgb(255 255 255 / .24), inset 0 -1px 0 rgb(0 0 0 / .16), 0 1px 2px rgb(20 50 35 / .2), 0 10px 22px -10px rgb(36 92 64 / .62);
  --f-soft: linear-gradient(180deg, #f7f2ea, #eee7da);
  --f-soft-sh: inset 0 1px 0 rgb(255 255 255 / .85), inset 0 0 0 1px rgb(var(--f-ink) / .07), 0 1px 2px rgb(var(--f-ink) / .06);
  --f-glow-a: rgb(244 205 168 / .5); --f-glow-b: rgb(204 224 194 / .75); }
.w.t-d { --f-ink: 0 0 0;
  --sh: inset 0 1px 0 rgb(255 255 255 / .055), 0 0 0 1px rgb(255 255 255 / .05), 0 2px 4px rgb(0 0 0 / .3), 0 18px 36px -18px rgb(0 0 0 / .85);
  --sh-hi: inset 0 1px 0 rgb(255 255 255 / .07), 0 0 0 1px rgb(255 255 255 / .07), 0 4px 10px rgb(0 0 0 / .35), 0 26px 48px -22px rgb(0 0 0 / .9);
  --ish: inset 0 1px 0 rgb(255 255 255 / .07), 0 0 0 1px rgb(255 255 255 / .06), 0 8px 18px -10px rgb(0 0 0 / .8);
  --f-sheen: linear-gradient(180deg, rgb(255 255 255 / .035), rgb(255 255 255 / 0) 55%);
  --f-chip-hi: inset 0 1px 0 rgb(255 255 255 / .08);
  --f-pri: linear-gradient(180deg, #a6e2bb 0%, #8fd4a7 55%, #7cc495 100%);
  --f-pri-sh: inset 0 1px 0 rgb(255 255 255 / .5), inset 0 -1px 0 rgb(0 0 0 / .12), 0 1px 2px rgb(0 0 0 / .4), 0 10px 24px -10px rgb(143 212 167 / .38);
  --f-soft: linear-gradient(180deg, #30352b, #282c24);
  --f-soft-sh: inset 0 1px 0 rgb(255 255 255 / .07), inset 0 0 0 1px rgb(255 255 255 / .05), 0 1px 2px rgb(0 0 0 / .3);
  --f-glow-a: rgb(232 179 102 / .07); --f-glow-b: rgb(143 212 167 / .09); }
.g { --shade: 0 1px 2px rgb(40 25 10 / .05), 0 8px 18px -10px rgb(40 25 10 / .14), 0 24px 44px -24px rgb(40 25 10 / .42);
  --mat-spec: linear-gradient(162deg, rgb(255 255 255 / .62) 0%, rgb(255 255 255 / .16) 34%, rgb(255 255 255 / 0) 58%, rgb(255 255 255 / .1) 100%);
  --mat-edge: inset 0 0 0 .5px rgb(255 255 255 / .8), inset 0 1px 0 rgb(255 255 255 / 1), inset 0 -1px 0 rgb(255 255 255 / .35);
  --sh-hi: var(--mat-edge), 0 2px 4px rgb(40 25 10 / .06), 0 14px 28px -12px rgb(40 25 10 / .2), 0 34px 60px -30px rgb(40 25 10 / .5);
  --f-sheen: var(--mat-spec);
  --f-chip-hi: inset 0 1px 0 rgb(255 255 255 / .8);
  --f-pri: linear-gradient(180deg, #e46a2c 0%, #cc5317 50%, #b8460f 100%);
  --f-pri-sh: inset 0 1px 0 rgb(255 255 255 / .3), inset 0 -1px 0 rgb(0 0 0 / .14), 0 1px 2px rgb(120 40 5 / .2), 0 12px 24px -10px rgb(191 68 13 / .62); }
.g.t-d { --shade: 0 2px 4px rgb(0 0 0 / .3), 0 18px 38px -16px rgb(0 0 0 / .9);
  --mat-spec: linear-gradient(162deg, rgb(255 255 255 / .14) 0%, rgb(255 255 255 / .04) 34%, rgb(255 255 255 / 0) 58%, rgb(255 255 255 / .03) 100%);
  --mat-edge: inset 0 0 0 .5px rgb(255 255 255 / .14), inset 0 1px 0 rgb(255 255 255 / .22), inset 0 -1px 0 rgb(255 255 255 / .05);
  --sh-hi: var(--mat-edge), 0 4px 10px rgb(0 0 0 / .35), 0 28px 50px -22px rgb(0 0 0 / .95);
  --f-chip-hi: inset 0 1px 0 rgb(255 255 255 / .12);
  --f-pri-sh: inset 0 1px 0 rgb(255 255 255 / .28), inset 0 -1px 0 rgb(0 0 0 / .2), 0 12px 26px -10px rgb(220 90 28 / .5); }
.g .card, .g .lst, .g .glass2, .g .qab, .g .acts2 > button, .g .pager > button, .g .chip:not(.on), .g .search, .g .field { box-shadow: var(--mat-edge), var(--shade); }

/* ---------- pozadie: teplé svetlo v rohoch (Teplá kuchyňa; v appke na body – adapt.css) ---------- */
.w .sc { background:
  linear-gradient(180deg, var(--tint) 0, var(--tint) var(--sat), transparent calc(var(--sat) + 90px)) local,
  radial-gradient(130% 380px at 100% 40px, var(--f-glow-a), transparent 70%) local,
  radial-gradient(110% 340px at 0 0, var(--f-glow-b), transparent 70%) local,
  linear-gradient(180deg, var(--tint) 0, color-mix(in srgb, var(--tint) 40%, var(--bg)) 160px, var(--bg) 320px) local; }

/* ---------- povrchy: karty a zoznamy ---------- */
/* Jemný odlesk zhora (na bielej karte nevidno, na farebnej je to lesk); karty s fotkou ho nedostanú. */
.w .card:not([class*="pic-"]), .w .lst { background-image: var(--f-sheen); }
.card, .lst { transition: transform var(--dur-2) var(--ease-out), box-shadow var(--dur-3) var(--ease-out); }
/* hlavné karty (súhrny, odhad, peniaze) o úroveň vyššie */
.est.card, .sum.card, .hsum.card, .kstat.card, /* hlavné súhrny (odhad nákupu, spolu z bločku) s jemným nádychom akcentovej farby – kľúčové číslo vynikne */
.w .est.card, .w .hsum.card { background-image: linear-gradient(155deg, color-mix(in srgb, var(--acc) 9%, transparent), transparent 62%), var(--f-sheen); }
.w.t-d .est.card, .w.t-d .hsum.card { background-image: linear-gradient(155deg, color-mix(in srgb, var(--acc) 10%, transparent), transparent 62%), var(--f-sheen); }
.g .est.card, .g .hsum.card { background-image: linear-gradient(155deg, color-mix(in srgb, var(--acc) 9%, transparent), transparent 60%), var(--mat-spec); }
.mrc.card { box-shadow: var(--sh-hi); }
.mrc.card { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--honey) 50%, transparent), var(--sh-hi) !important; }
.hrow.warn { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--honey) 50%, transparent), var(--sh-hi) !important;
  background-image: linear-gradient(180deg, color-mix(in srgb, var(--honey) 7%, transparent), transparent 70%); }

/* ---------- ikonové dlaždice: farebné kamienky s vnútorným svetlom ---------- */
.th.ic, .qab .qi, .hqab .qi, .w .hqab .qi, .g .hqab .qi, .row .th.ic {
  background: linear-gradient(150deg, color-mix(in srgb, var(--acc) 20%, var(--card)), color-mix(in srgb, var(--acc) 9%, var(--card)));
  box-shadow: var(--f-chip-hi), inset 0 0 0 1px color-mix(in srgb, var(--acc) 14%, transparent); color: var(--acc); }
.g .th.ic, .g .row .th.ic, .g .qab .qi, .g .hqab .qi {
  background: linear-gradient(150deg, color-mix(in srgb, var(--acc) 22%, rgb(255 255 255 / .7)), color-mix(in srgb, var(--acc) 10%, rgb(255 255 255 / .35))); }
.g.t-d .th.ic, .g.t-d .row .th.ic, .g.t-d .qab .qi, .g.t-d .hqab .qi {
  background: linear-gradient(150deg, color-mix(in srgb, var(--acc) 30%, rgb(255 255 255 / .06)), color-mix(in srgb, var(--acc) 12%, rgb(255 255 255 / .02))); }
.hrow.warn .th.ic, .mrc-i { background: linear-gradient(150deg, color-mix(in srgb, var(--honey) 24%, var(--card)), color-mix(in srgb, var(--honey) 10%, var(--card)));
  box-shadow: var(--f-chip-hi), inset 0 0 0 1px color-mix(in srgb, var(--honey) 20%, transparent); color: var(--honey); }
.th.ic.dng { background: linear-gradient(150deg, color-mix(in srgb, var(--danger) 18%, var(--card)), color-mix(in srgb, var(--danger) 8%, var(--card))); color: var(--danger);
  box-shadow: var(--f-chip-hi), inset 0 0 0 1px color-mix(in srgb, var(--danger) 14%, transparent); }
/* dlaždice s 3D emoji (produkty, kategórie): tanierik so svetlom zhora, emoji s mäkkým tieňom */
.th:has(> .em), .tile:has(> .em) {
  background-image: radial-gradient(120% 90% at 50% 18%, rgb(255 255 255 / .75), rgb(255 255 255 / 0) 62%);
  box-shadow: var(--f-chip-hi), inset 0 0 0 1px rgb(var(--f-ink, 0 0 0) / .05); }
.t-d .th:has(> .em), .t-d .tile:has(> .em) { background-image: radial-gradient(120% 90% at 50% 18%, rgb(255 255 255 / .08), rgb(255 255 255 / 0) 62%); box-shadow: var(--f-chip-hi), inset 0 0 0 1px rgb(255 255 255 / .05); }
.th > .em, .tile > .em, .chip > .em, .hrow .th .em { filter: drop-shadow(0 3px 3px rgb(60 35 10 / .2)); }
.t-d .th > .em, .t-d .tile > .em, .t-d .chip > .em { filter: drop-shadow(0 3px 4px rgb(0 0 0 / .45)); }
/* dlaždica obchodu: lesk zhora a tenká svetlá hrana */
.stile { position: relative; overflow: hidden; text-shadow: 0 1px 1px rgb(0 0 0 / .18);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .32), inset 0 0 0 1px rgb(255 255 255 / .1), 0 1px 2px rgb(0 0 0 / .14), 0 6px 12px -6px rgb(0 0 0 / .45); }
.stile::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(180deg, rgb(255 255 255 / .24), rgb(255 255 255 / 0) 46%, rgb(0 0 0 / .1)); }

/* ---------- tlačidlá ---------- */
.btn { transition: transform 460ms var(--ease-spring), box-shadow var(--dur-3), filter var(--dur-2), opacity var(--dur-2), background-color var(--dur-2), color var(--dur-2); }
.btn:active:not(:disabled) { transform: scale(.955); filter: brightness(.95) saturate(1.05); transition-duration: 90ms; }
.btn.pri, .w .btn.pri, .g .btn.pri { background: var(--f-pri); box-shadow: var(--f-pri-sh); text-shadow: 0 1px 1px rgb(0 0 0 / .12); }
.w.t-d .btn.pri { text-shadow: none; }
.btn.pri:active:not(:disabled) { box-shadow: inset 0 1px 0 rgb(255 255 255 / .18), inset 0 2px 6px rgb(0 0 0 / .18), 0 4px 10px -6px rgb(0 0 0 / .4); }
.w .btn.soft { background: var(--f-soft); box-shadow: var(--f-soft-sh); }
.w .btn.danger.soft { background: var(--dangers); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--danger) 16%, transparent); }
.btn.ok { background: linear-gradient(180deg, color-mix(in srgb, var(--ok) 88%, #fff), var(--ok)); box-shadow: inset 0 1px 0 rgb(255 255 255 / .25), 0 10px 20px -10px color-mix(in srgb, var(--ok) 70%, transparent); }
.btn:disabled { filter: saturate(.6); }
/* tónové akcie v riadkoch (košík na karte, ▶ Variť): hrana a pružné stlačenie */
.lgo, .hplay { box-shadow: var(--f-chip-hi), inset 0 0 0 1px color-mix(in srgb, var(--acc) 16%, transparent);
  background-image: linear-gradient(180deg, rgb(255 255 255 / .35), rgb(255 255 255 / 0) 60%); transition: transform 460ms var(--ease-spring), filter var(--dur-2); }
.t-d .lgo, .t-d .hplay { background-image: linear-gradient(180deg, rgb(255 255 255 / .06), rgb(255 255 255 / 0) 60%); }
.lgo:active, .hplay:active { transform: scale(.9); transition-duration: 90ms; }
/* okrúhle tlačidlá v hlavičke */
.ib { transition: transform 460ms var(--ease-spring), box-shadow var(--dur-3); }
.ib:active { transform: scale(.88); transition-duration: 90ms; }
.chip.on, .w .chips.filt .chip.on { background: var(--f-pri); color: var(--onpri); box-shadow: var(--f-pri-sh); }
.g .chip.on { background: var(--fg); color: var(--bg); box-shadow: 0 8px 18px -10px rgb(0 0 0 / .5); }

/* ---------- karty a riadky: odozva na dotyk ---------- */
.tapc, .hqab, .ctile, .rcard, .tentry, .lcard { transition: transform 460ms var(--ease-spring), box-shadow var(--dur-3) var(--ease-out); }
.tapc:active, .hqab:active, .ctile:active, .tentry:active { transform: scale(.972); transition-duration: 110ms; }
/* riadok v zozname sa nezmenšuje (vyzerá to ako odtrhnutý), len sa rozsvieti podklad – ako v iOS */
.lst > .row.tap:active, .lst > button.row:active { transform: none; background-color: color-mix(in srgb, var(--fg) 6%, transparent); transition-duration: 60ms; }
@media (hover: hover) and (pointer: fine) {
  .tapc:hover, .hqab:hover, .ctile:hover, .tentry:hover { transform: translateY(-2px); box-shadow: var(--sh-hi); }
  .lst > .row.tap:hover, .lst > button.row:hover { background-color: color-mix(in srgb, var(--fg) 3.5%, transparent); }
  .btn.pri:hover:not(:disabled) { filter: brightness(1.05); }
}

/* ---------- Domov: rýchle akcie, sekcie ---------- */
.hqab { box-shadow: var(--sh); background-image: var(--f-sheen); gap: 8px; }
.hqab .qi { width: 42px; height: 42px; border-radius: 14px; }
.hqab .qi .ico { width: 22px; height: 22px; }
.hsec-h h2 { display: flex; align-items: center; gap: 8px; }
.hsec-h h2::before { content: ""; width: 6px; height: 6px; border-radius: 99px; background: var(--acc); opacity: .7; flex: none; }
.hplay { width: 46px; height: 46px; }

/* ---------- Nákupy: karta zoznamu ---------- */
.card.lcard { padding: 14px 14px 14px 16px; }
.lcard .lgo { width: 46px; height: 46px; border-radius: 16px; }
.lcard .ra .price { font-variant-numeric: tabular-nums; }

/* ---------- Recepty: kategórie, Ochutnávač ---------- */
.ctile { box-shadow: var(--sh); isolation: isolate; }
/* (::after už nesie tmavý prechod pod textom – svetlá hrana je preto na ::before) */
.ctile::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 2;
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .28), inset 0 0 0 1px rgb(255 255 255 / .12); }
.ctile[class*="pic-"]::after { background: linear-gradient(180deg, rgb(0 0 0 / 0) 28%, rgb(0 0 0 / .18) 50%, rgb(0 0 0 / .72)); }
.ctile[class*="pic-"] b { text-shadow: 0 1px 2px rgb(0 0 0 / .35), 0 2px 12px rgb(0 0 0 / .3); }
.ctile[class*="pic-"] small { opacity: .88; text-shadow: 0 1px 2px rgb(0 0 0 / .4); }
.tentry { box-shadow: var(--sh-hi); }
.tentry .te-go { box-shadow: 0 8px 18px -8px rgb(0 0 0 / .6), inset 0 -1px 0 rgb(0 0 0 / .08); transition: transform 460ms var(--ease-spring); }
.tentry:active .te-go { transform: scale(.9); }

/* ---------- prepínač (Seg): posuvný jazdec namiesto preblikovania ---------- */
.seg { position: relative; isolation: isolate; }
.seg:has(> button.on)::before { content: ""; position: absolute; z-index: -1; top: 3px; bottom: 3px;
  width: calc((100% - 6px) / var(--sn, 3)); left: calc(3px + (100% - 6px) / var(--sn, 3) * var(--si, 0));
  border-radius: 99px; background: var(--mat-spec), var(--segon); box-shadow: var(--mat-edge), 0 1px 2px rgb(0 0 0 / .08), 0 4px 12px -4px rgb(0 0 0 / .22);
  transition: left 460ms var(--ease-spring); }
.seg:has(> button.on) > button.on { background: none; box-shadow: none; }
.seg > button { transition: color var(--dur-3); }
.seg:has(> :nth-child(2):last-child) { --sn: 2; }
.seg:has(> :nth-child(3):last-child) { --sn: 3; }
.seg:has(> :nth-child(4):last-child) { --sn: 4; }
.seg:has(> :nth-child(5):last-child) { --sn: 5; }
.seg:has(> button.on:nth-child(2)) { --si: 1; }
.seg:has(> button.on:nth-child(3)) { --si: 2; }
.seg:has(> button.on:nth-child(4)) { --si: 3; }
.seg:has(> button.on:nth-child(5)) { --si: 4; }

/* ---------- spodná lišta ---------- */
.tabbar { box-shadow: var(--mat-edge), 0 1px 2px rgb(0 0 0 / .05), 0 12px 28px -12px rgb(40 25 10 / .3), 0 30px 50px -30px rgb(40 25 10 / .45) !important; }
.t-d .tabbar { box-shadow: var(--mat-edge), 0 18px 40px -16px rgb(0 0 0 / .95) !important; }
.tic { isolation: isolate; }
.w .tabbar > button .tic::before { content: ""; position: absolute; z-index: -1; inset: -5px -15px; border-radius: 99px;
  background: color-mix(in srgb, var(--acc) 13%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--acc) 10%, transparent);
  opacity: 0; transform: scale(.55); transition: opacity var(--dur-2), transform 460ms var(--ease-spring); }
.w .tabbar > button.on .tic::before { opacity: 1; transform: none; }
.w .tabbar > button.on { color: var(--acc); }
.g .tabbar > button.on { background: color-mix(in srgb, var(--fg) 7%, transparent); box-shadow: inset 0 1px 0 rgb(255 255 255 / .5), inset 0 0 0 .5px rgb(255 255 255 / .4); }
.g.t-d .tabbar > button.on { box-shadow: inset 0 1px 0 rgb(255 255 255 / .1), inset 0 0 0 .5px rgb(255 255 255 / .08); }
.tbadge { background: linear-gradient(180deg, color-mix(in srgb, var(--danger) 85%, #fff), var(--danger)); }
/* mikrofón: hlavné tlačidlo appky – plná farba s leskom a jemnou žiarou */
.tmb, .t-d .tmb { background: var(--f-pri); color: var(--onpri);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .3), inset 0 -2px 4px rgb(0 0 0 / .14), 0 0 0 4px color-mix(in srgb, var(--acc) 13%, transparent), 0 12px 24px -8px color-mix(in srgb, var(--acc) 60%, transparent);
  transition: transform 460ms var(--ease-spring), box-shadow var(--dur-3); }
.g .tmb, .g.t-d .tmb { color: #fff; box-shadow: inset 0 1px 0 rgb(255 255 255 / .32), inset 0 -2px 4px rgb(0 0 0 / .16), 0 0 0 4px rgb(220 90 28 / .14), 0 12px 24px -8px rgb(191 68 13 / .6); }
.tmb .ico { filter: drop-shadow(0 1px 1px rgb(0 0 0 / .18)); }
.tmic:active .tmb { transform: scale(.88); transition-duration: 90ms; }
.tmic.on .tmb, .t-d .tmic.on .tmb, .g .tmic.on .tmb { background: var(--acc); color: var(--onacc, #fff); }

/* ---------- prázdne stavy: emoji sa vznáša nad mäkkým kruhom ---------- */
.empty { position: relative; isolation: isolate; padding-top: 30px; }
.empty::before { content: ""; position: absolute; z-index: -1; left: 50%; top: 14px; width: 120px; height: 120px; margin-left: -60px; border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--acc) 14%, transparent), color-mix(in srgb, var(--acc) 5%, transparent) 70%, transparent); }
.empty > .em { filter: drop-shadow(0 12px 12px rgb(60 35 10 / .22)); }
.empty b { font-size: 19px; letter-spacing: -.35px; }
.w .empty b { font-family: var(--serif); font-weight: 560; font-variation-settings: "opsz" 36; }

/* ---------- texty: nič nepreteká, dlhé názvy na dva riadky ---------- */
.tx > b, .hrow .grow b, .mrc-r .grow b, .lcard .tw > span:first-child {
  white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: break-word; line-height: 1.22; }
.lt, .h2, .ttl, .empty b { text-wrap: balance; }
.meta, .sub, .empty p, .hint, .tip span { text-wrap: pretty; }
.price, .sub, .stat, .amt { font-variant-numeric: tabular-nums; }
/* odškrtnutie v nákupe: čiara cez názov je pozadie textu, takže prečiarkne aj dvojriadkový názov (riadok po riadku) */
.row.ck .stk::after { display: none; }
.row.ck .stk { background: linear-gradient(currentColor, currentColor) no-repeat 0 56% / 0 2px; animation: f-strike var(--dur-3) .18s var(--ease-out) forwards; }
@keyframes f-strike { to { background-size: 100% 2px; } }
/* štítky stavu (chýba bloček…) sa nezalomia a nestlačia názov */
.stat { flex: none; }
.tx .stat { align-self: flex-start; margin-top: 3px; padding: 3px 9px; font-size: 12.5px; }
/* chýbajúce bločky vo Výdavkoch: názov má miesto, tlačidlá sú kompaktné */
.mrc-r { gap: 10px; }
.mrc-r .ib.sm { width: 36px; height: 36px; }
.mrc-r .ib.mrc-cam { width: 44px; height: 44px; background: linear-gradient(150deg, color-mix(in srgb, var(--acc) 20%, var(--card)), color-mix(in srgb, var(--acc) 9%, var(--card))); color: var(--acc);
  box-shadow: var(--f-chip-hi), inset 0 0 0 1px color-mix(in srgb, var(--acc) 16%, transparent); }
.g .mrc-r .ib.mrc-cam { background: linear-gradient(150deg, color-mix(in srgb, var(--acc) 22%, rgb(255 255 255 / .7)), color-mix(in srgb, var(--acc) 10%, rgb(255 255 255 / .35))); }
.g.t-d .mrc-r .ib.mrc-cam { background: linear-gradient(150deg, color-mix(in srgb, var(--acc) 30%, rgb(255 255 255 / .06)), color-mix(in srgb, var(--acc) 12%, rgb(255 255 255 / .02))); }
/* štatistiky výrobku a druhu: tri rovnaké stĺpce, číslo sa zmenší a jednotka môže ísť pod neho */
.card.kstat { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kstat > div { min-width: 0; }
.kstat > div + div { padding-left: 10px; border-left: 1px solid var(--line); }
.kstat .price, .w .kstat .price, .g .kstat .price { font-size: 19px; line-height: 1.1; white-space: normal; overflow-wrap: break-word; letter-spacing: -.4px; }
.kstat .meta.sm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kstat .price .pu { display: block; margin-top: 3px; font-family: var(--font); font-size: 13px; font-weight: 650; letter-spacing: 0; color: var(--sec); }

/* ---------- postupný nástup obsahu obrazovky ---------- */
/* Len karty a bloky bez pevných prvkov vnútri (posun by inak pevné prvky odtrhol). Výplň „backwards“ – po
 * dobehnutí na prvku nič neostane, ťahanie riadkov funguje ako predtým. :where() = najnižšia priorita, takže
 * existujúce zvýraznenia (nový zoznam z receptu, rozsvietený riadok, odškrtnutie) majú vždy prednosť.
 * Oneskorenie je v premennej, aby neprepísalo oneskorenie iných animácií. */
@media (prefers-reduced-motion: no-preference) {
  .body > :where(.card, .lst, .hsec, .seg, .search, .tentry, .cgrid, .hqa, .rrow, .h2, .empty, .tip, .chips) {
    animation: f-rise 520ms var(--ease-out) var(--fd, 0ms) backwards; }
  .body > :nth-child(2) { --fd: 30ms; } .body > :nth-child(3) { --fd: 60ms; } .body > :nth-child(4) { --fd: 90ms; }
  .body > :nth-child(5) { --fd: 120ms; } .body > :nth-child(6) { --fd: 150ms; } .body > :nth-child(7) { --fd: 180ms; }
  .body > :nth-child(8) { --fd: 210ms; } .body > :nth-child(n+9) { --fd: 240ms; }
  /* karty zoznamov v Nákupoch */
  :where(.lcard) { animation: f-rise 520ms var(--ease-out) var(--ld, 0ms) backwards; }
  .lcard:nth-of-type(2) { --ld: 40ms; } .lcard:nth-of-type(3) { --ld: 80ms; } .lcard:nth-of-type(4) { --ld: 120ms; }
  .lcard:nth-of-type(5) { --ld: 160ms; } .lcard:nth-of-type(n+6) { --ld: 200ms; }
  /* riadky zoznamu naskočia jeden po druhom (prvých 12) */
  .lst > :where(.row:nth-child(-n+12)) { animation: f-row 440ms var(--ease-out) var(--rd, 0ms) backwards; }
  .lst > .row:nth-child(2) { --rd: 25ms; } .lst > .row:nth-child(3) { --rd: 50ms; } .lst > .row:nth-child(4) { --rd: 75ms; }
  .lst > .row:nth-child(5) { --rd: 100ms; } .lst > .row:nth-child(6) { --rd: 125ms; } .lst > .row:nth-child(n+7) { --rd: 150ms; }
  /* dlaždice Rýchlo a kategórie receptov s pružinou */
  .hqa > :where(.hqab), .cgrid > :where(.ctile) { animation: f-pop-in 560ms var(--ease-spring) var(--qd, 0ms) backwards; }
  .hqa > :nth-child(2), .cgrid > :nth-child(2) { --qd: 60ms; } .hqa > :nth-child(3), .cgrid > :nth-child(3) { --qd: 120ms; }
  .cgrid > :nth-child(4) { --qd: 160ms; } .cgrid > :nth-child(n+5) { --qd: 200ms; }
  /* vznášajúce sa prvky (len posun – nič sa neprekresľuje) */
  .empty > .em { animation: f-float 5.5s ease-in-out infinite; }
  .tentry .te-ph i:nth-child(1) { animation: f-fan1 5s ease-in-out infinite; }
  .tentry .te-ph i:nth-child(3) { animation: f-fan3 5s ease-in-out infinite; }
  .tentry .te-ph i:nth-child(2) { animation: f-float 5s ease-in-out infinite; }
  .tabbar > button.on .tic > .ico { animation: f-tabpop 520ms var(--ease-spring); }
  .tbadge { animation: f-pop 520ms var(--ease-spring); }
}
@keyframes f-rise { from { opacity: 0; transform: translateY(12px) scale(.985); } }
@keyframes f-row { from { opacity: 0; transform: translateY(6px); } }
@keyframes f-pop-in { from { opacity: 0; transform: translateY(8px) scale(.92); } }
@keyframes f-pop { 0% { transform: scale(.4); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
@keyframes f-tabpop { 0% { transform: scale(.82) translateY(2px); } 55% { transform: scale(1.12) translateY(-2px); } 100% { transform: none; } }
@keyframes f-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes f-fan1 { 0%, 100% { transform: rotate(-9deg); } 50% { transform: rotate(-13deg) translateX(-3px); } }
@keyframes f-fan3 { 0%, 100% { transform: rotate(9deg); } 50% { transform: rotate(13deg) translateX(3px); } }
@media (prefers-reduced-motion: reduce) {
  .seg:has(> button.on)::before { transition: none; }
}
